<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socket.io Application</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --primary: #6c5ce7;
        --primary-light: #a29bfe;
        --primary-dark: #4834d4;
        --accent: #00d2d3;
        --bg-1: #0f0c29;
        --bg-2: #302b63;
        --bg-3: #24243e;
        --surface: rgba(255, 255, 255, 0.85);
        --surface-solid: #ffffff;
        --text-dark: #1a1a2e;
        --text-muted: #6b7280;
        --danger: #ff6b6b;
        --success: #00c896;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 10px;
        --shadow-soft: 0 8px 32px rgba(31, 20, 80, 0.15);
        --shadow-hover: 0 16px 40px rgba(31, 20, 80, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text-dark);
        padding: 32px 20px;
        position: relative;
        overflow-x: hidden;
        background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--primary-dark), var(--bg-3));
        background-size: 400% 400%;
        animation: gradientShift 18s ease infinite;
      }

      @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 15% 20%, rgba(108, 92, 231, 0.35), transparent 40%),
          radial-gradient(circle at 85% 80%, rgba(0, 210, 211, 0.25), transparent 40%);
        pointer-events: none;
        z-index: 0;
      }

      h1 {
        position: relative;
        text-align: center;
        color: #fff;
        font-weight: 800;
        font-size: 2.4rem;
        letter-spacing: -0.5px;
        margin: 0 0 32px;
        background: linear-gradient(120deg, #ffffff, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeDown 0.6s ease;
      }

      h2, h3, h4 {
        margin: 0 0 14px;
        color: var(--text-dark);
        font-weight: 700;
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      #login-container,
      #app-container,
      #chat-container {
        position: relative;
        z-index: 1;
        max-width: 460px;
        margin: 0 auto 24px;
        background: var(--surface);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        box-shadow: var(--shadow-soft);
        animation: fadeUp 0.5s ease;
        transition: box-shadow 0.3s ease;
      }

      #login-container:hover,
      #app-container:hover,
      #chat-container:hover {
        box-shadow: var(--shadow-hover);
      }

      #login-container h2 {
        text-align: center;
        font-size: 1.6rem;
        background: linear-gradient(120deg, var(--primary-dark), var(--primary));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 22px;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"] {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 14px;
        border: 1.5px solid #e6e8f0;
        border-radius: var(--radius-sm);
        font-size: 14.5px;
        font-family: inherit;
        background: #f8f9fc;
        color: var(--text-dark);
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      }

      input::placeholder {
        color: #a3a6ba;
      }

      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="email"]:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.14);
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: var(--radius-sm);
        padding: 13px 20px;
        font-size: 14px;
        font-family: inherit;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        margin: 0 8px 12px 0;
        box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        position: relative;
        overflow: hidden;
      }

      button::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.25);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease;
      }

      button:hover::after {
        transform: scaleX(1);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(108, 92, 231, 0.45);
      }

      button:active {
        transform: translateY(0) scale(0.98);
      }

      #login-container > button[onclick="showRegisterForm()"],
      #app-container > button[onclick="loadRooms()"] {
        background: #eef0f9;
        color: var(--primary-dark);
        box-shadow: none;
      }

      #login-container > button[onclick="showRegisterForm()"]:hover,
      #app-container > button[onclick="loadRooms()"]:hover {
        background: #e2e5f7;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }

      #register-container {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1.5px dashed #e2e5ec;
        animation: fadeUp 0.35s ease;
      }

      #register-container h2 {
        font-size: 1.3rem;
      }

      #login-message,
      #register-message {
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--danger);
        min-height: 18px;
        margin-top: 6px;
      }

      #app-container h2 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 18px;
      }

      #app-container h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-top: 22px;
      }

      #room-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }

      #room-list > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, #f8f9fc, #eef0fb);
        border: 1px solid #ecedf7;
        border-radius: var(--radius-md);
        padding: 14px 18px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #room-list > div:hover {
        transform: translateX(4px);
        box-shadow: 0 6px 18px rgba(108, 92, 231, 0.15);
      }

      #room-list h4 {
        margin: 0;
        font-size: 15px;
        color: var(--text-dark);
      }

      #room-list p {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      #room-list button {
        margin: 0;
        padding: 9px 18px;
        font-size: 13px;
        box-shadow: 0 3px 10px rgba(108, 92, 231, 0.3);
      }

      #chat-container {
        max-width: 580px;
      }

      #current-room-name {
        text-align: center;
        font-size: 1.3rem;
        padding-bottom: 14px;
        margin-bottom: 16px;
        border-bottom: 1.5px solid #ecedf7;
        background: linear-gradient(120deg, var(--primary-dark), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      #messages {
        height: 380px;
        overflow-y: auto;
        background: #f8f9fc;
        border-radius: var(--radius-md);
        padding: 18px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      #messages::-webkit-scrollbar {
        width: 7px;
      }

      #messages::-webkit-scrollbar-track {
        background: transparent;
      }

      #messages::-webkit-scrollbar-thumb {
        background: linear-gradient(var(--primary-light), var(--primary));
        border-radius: 10px;
      }

      #messages > div {
        background: #fff;
        border-radius: var(--radius-sm);
        border-top-left-radius: 4px;
        padding: 10px 14px;
        box-shadow: 0 2px 8px rgba(31, 20, 80, 0.08);
        max-width: 82%;
        animation: fadeUp 0.25s ease;
        transition: transform 0.15s ease;
      }

      #messages > div:hover {
        transform: translateY(-1px);
      }

      #messages strong {
        display: inline-block;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
        margin-right: 6px;
        letter-spacing: 0.3px;
      }

      #messages p {
        margin: 0;
        font-size: 14.5px;
        line-height: 1.5;
        word-break: break-word;
        color: var(--text-dark);
      }

      #messages small {
        display: block;
        margin-top: 6px;
        font-size: 10.5px;
        color: #a3a6ba;
        font-weight: 500;
      }

      #message-input {
        width: calc(100% - 106px);
        display: inline-block;
        vertical-align: middle;
        margin-bottom: 0;
        border-radius: 24px;
        padding: 13px 20px;
      }

      #chat-container button[onclick="sendMessage()"] {
        width: 92px;
        display: inline-block;
        vertical-align: middle;
        margin: 0 0 0 8px;
        border-radius: 24px;
        padding: 13px 10px;
      }

      #room-list:empty::after {
        content: "No rooms yet — check back soon ✨";
        display: block;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        padding: 20px 0;
      }

      #messages:empty::after {
        content: "No messages yet. Say hello 👋";
        display: block;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        margin: auto;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 12px;
        }

        h1 {
          font-size: 1.8rem;
        }

        #login-container,
        #app-container,
        #chat-container {
          padding: 26px 20px;
          margin: 0 0 18px;
        }

        #message-input {
          width: 100%;
          margin-bottom: 10px;
        }

        #chat-container button[onclick="sendMessage()"] {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  </head>
  <body>
    <h1>Socket Chat</h1>
    <div id="login-container">
      <h2>Login</h2>

      <input id="login-username" type="text" placeholder="Username">
      <input id="login-password" type="password" placeholder="Password">

      <button onclick="login()">Login</button>
      <button onclick="showRegisterForm()">Dont have an account? register</button>
      <div id="register-container">

      </div>
      <p id="login-message"></p>
    </div>
    <div id="app-container" style="display:none;">
      <h2>Socket Chat</h2>
      <button onclick="logout()" style="float:right; background:#eef0f9; color:var(--primary-dark); box-shadow:none;">Logout</button>

      <input id="new-room-name" type="text" placeholder="New Room Name">
      <button onclick="createRoom()">Create Room</button>
      <button onclick="loadRooms()">Refresh Rooms</button>
      <h3>Available Rooms</h3>
      <div id="room-list"></div>
    </div>
    <div id="chat-container" style="display:none;">

      <h2 id="current-room-name"></h2>

      <div id="messages"></div>

      <input
        id="message-input"
        type="text"
        placeholder="Type a message"
      >

      <button onclick="sendMessage()">Send</button>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      let currentRoomId = null;
      async function checkLogin() {
        const response = await fetch("/api/me");

        if (response.ok) {
          document.getElementById("login-container").style.display = "none";
          document.getElementById("app-container").style.display = "block";

          loadRooms();
        } else {
          document.getElementById("login-container").style.display = "block";
          document.getElementById("app-container").style.display = "none";
        }
      }
      async function login(){
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;
        const response=await fetch("/api/login",{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            username:username,
            password:password
          })
        });
        const data=await response.json();
        document.getElementById("login-message").innerText = data.message;
        if (response.ok) {
          document.getElementById("login-container").style.display = "none";
          document.getElementById("app-container").style.display = "block";

          loadRooms();
        }
      }
    async function logout(){
      const response = await fetch("/api/logout", {
        method: "POST"
      });
    
      if (response.ok) {
        currentRoomId = null;
        document.getElementById("chat-container").style.display = "none";
        document.getElementById("app-container").style.display = "none";
        document.getElementById("login-container").style.display = "block";
        document.getElementById("login-username").value = "";
        document.getElementById("login-password").value = "";
        document.getElementById("login-message").innerText = "";
      } else {
        window.alert("Logout failed, please try again");
      }
    }
      function showRegisterForm(){
        const registerContainer =
          document.getElementById("register-container");

        registerContainer.innerHTML = `
          <h2>Register</h2>

          <input
            id="register-username"
            type="text"
            placeholder="Username"
          >

          <input
            id="register-email"
            type="email"
            placeholder="Email"
          >

          <input
            id="register-password"
            type="password"
            placeholder="Password"
          >

          <button onclick="register()">Register</button>

          <p id="register-message"></p>
        `;
      }
      async function register(){
        const username = document.getElementById("register-username").value;
        const email = document.getElementById("register-email").value;
        const password = document.getElementById("register-password").value;

        const response=await fetch('/api/register',{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            username:username,
            email:email,
            password:password
          })
        })
        window.location.reload();
        window.alert("Registered successfully, please login");
      }

      async function createRoom(){
        const roomName = document.getElementById("new-room-name").value.trim();

        if(!roomName){
          window.alert("Please enter a room name");
          return;
        }

        const response = await fetch("/api/create-room",{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            name:roomName
          })
        });

        const data = await response.json();

        console.log(data);

        if(response.ok){
          document.getElementById("new-room-name").value = "";
          loadRooms();
        }
      }
      async function loadRooms(){
        const response=await fetch('/api/get-rooms')
        const data=await response.json();
        console.log(data);
        const roomlist=document.getElementById("room-list");
        roomlist.innerHTML="";
        data.message.forEach(room=>{
          const div=document.createElement('div');
          div.innerHTML=`
            <h4>${room.name}</h4>
            <p>Room ID: ${room.room_id}</p>
            <button onclick="joinRoom(${room.room_id}, '${room.name}')">
              Join
            </button>
            <button onclick="deleteRoom('${room.name}')" style="background:linear-gradient(135deg, var(--danger), #d63447);">
              Delete
            </button>
          `
          roomlist.appendChild(div);
        })
      }
      async function joinRoom(roomid,roomname){
        const response=await fetch("/api/join-room",{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            name:roomname
          })
        })
        currentRoomId = roomid;
        const data=await response.json();
        console.log(data);
        if (response.ok) {
          document.getElementById("app-container").style.display = "none";
          document.getElementById("chat-container").style.display = "block";
          document.getElementById("current-room-name").innerText = roomname;
          socket.emit("join-room", roomid);
          loadMessages(roomid)
        }
      }
      async function deleteRoom(roomName){
        const confirmed = window.confirm(`Delete room "${roomName}"? This cannot be undone.`);
        if(!confirmed){
          return;
        }

        const response = await fetch("/api/delete-room",{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            name: roomName
          })
        });
      
        const data = await response.json();
        console.log(data);
      
        if(response.ok){
          loadRooms();
        } else {
          window.alert(data.message || "Failed to delete room");
        }
    }
      async function loadMessages(roomId) {
        const response = await fetch(`/api/${roomId}/messages`);
        const data = await response.json();
        console.log(data);
        const cont = document.getElementById("messages");

        cont.innerHTML = "";

        for (const mes of data.messages) {
          const div = document.createElement("div");

          div.innerHTML = `
            <p>
              <strong>${mes.username}</strong>:
              ${mes.message}
            </p>
            <small>${mes.created_at}</small>
          `;

          cont.appendChild(div);
        }
      }
      async function sendMessage(){

        const input = document.getElementById("message-input");

        const message = input.value.trim();

        if(!message){
          return;
        }

        const response = await fetch(`/api/${currentRoomId}/messages`,{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            message:message
          })
        });

        const data = await response.json();

        console.log(data);

        if(response.ok){
          input.value = "";
        }
        loadMessages(currentRoomId);
      }
      checkLogin();
      loadRooms();
      window.location.reload();
    </script>
  </body>
</html>
